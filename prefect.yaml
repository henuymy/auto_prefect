name: auto-notify
prefect-version: "3.0"

deployments:
  - name: notify-daily
    entrypoint: flows/notify_single_flow.py:auto_notify_flow
    parameters:
      config_path: config/tasks/日通报.json
    work_pool:
      name: default-agent-pool
      work_queue_name: default
  - name: dashboard-collection
    entrypoint: flows/dashboard_metric_flow.py:dashboard_metric_flow
    parameters:
      mode: REALTIME
      config_path: config/dashboard/session.json
      trigger_type: SCHEDULED
      force_refresh: false
    schedules:
      - cron: "*/5 * * * *"
        timezone: Asia/Shanghai
        active: true
    work_pool:
      name: default-agent-pool
      work_queue_name: default
  - name: dashboard-daily
    entrypoint: flows/dashboard_metric_flow.py:dashboard_metric_flow
    parameters:
      mode: DAY_ACC
      config_path: config/dashboard/session.json
      trigger_type: SCHEDULED
      force_refresh: false
    work_pool:
      name: default-agent-pool
      work_queue_name: default
  - name: dashboard-monthly
    entrypoint: flows/dashboard_metric_flow.py:dashboard_metric_flow
    parameters:
      mode: MONTH
      config_path: config/dashboard/session.json
      trigger_type: SCHEDULED
      force_refresh: false
    work_pool:
      name: default-agent-pool
      work_queue_name: default
