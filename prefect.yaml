name: auto-notify
prefect-version: "3.0"

deployments:
  - name: dashboard-collection
    entrypoint: flows/dashboard_metric_flow.py:dashboard_metric_flow
    parameters:
      mode: REALTIME
      config_path: config/dashboard/session.json
      trigger_type: SCHEDULED
      force_refresh: false
    schedules:
      - cron: "*/5 * * * *"
        timezone: Asia/Shanghai
        active: false
    work_pool:
      name: windows-dashboard-pool
      work_queue_name: default
  - name: dashboard-daily-acc
    description: 日累计
    entrypoint: flows/dashboard_metric_flow.py:dashboard_metric_flow
    parameters:
      mode: DAY_ACC
      config_path: config/dashboard/session.json
      trigger_type: SCHEDULED
      force_refresh: false
    work_pool:
      name: windows-dashboard-pool
      work_queue_name: default
  - name: dashboard-monthly
    entrypoint: flows/dashboard_metric_flow.py:dashboard_metric_flow
    parameters:
      mode: MONTH
      config_path: config/dashboard/session.json
      trigger_type: SCHEDULED
      force_refresh: false
    work_pool:
      name: windows-dashboard-pool
      work_queue_name: default
  - name: dashboard-indicator-sync
    entrypoint: flows/dashboard_metric_flow.py:dashboard_metric_flow
    parameters:
      mode: INDICATOR_SYNC
      config_path: config/dashboard/session.json
      trigger_type: SCHEDULED
      force_refresh: false
    schedules:
      - cron: "10 8 * * *"
        timezone: Asia/Shanghai
        active: true
    work_pool:
      name: windows-dashboard-pool
      work_queue_name: default
  - name: dashboard-v2-partition-maintenance
    entrypoint: flows/dashboard_partition_maintenance_flow.py:dashboard_v2_partition_maintenance_flow
    parameters:
      config_path: config/dashboard/session.json
    schedules:
      - cron: "20 2 * * *"
        timezone: Asia/Shanghai
        active: true
    work_pool:
      name: windows-dashboard-pool
      work_queue_name: default
  - name: session-keeper
    entrypoint: flows/session_keeper_flow.py:session_keeper_flow
    parameters:
      config_path: config/modules/session_keeper.json
    schedules:
      - cron: "*/10 * * * *"
        timezone: Asia/Shanghai
        active: false
    work_pool:
      name: windows-session-pool
      work_queue_name: default
  - name: notify-PK赛通报
    entrypoint: flows/notify_single_flow.py:auto_notify_flow
    parameters:
      config_path: config/tasks/PK赛通报.json
    schedules:
      - cron: "0 9-13 * * *"
        timezone: Asia/Shanghai
        active: false
      - cron: "0,30 14-15 * * *"
        timezone: Asia/Shanghai
        active: false
      - cron: "*/10 16 * * *"
        timezone: Asia/Shanghai
        active: false
      - cron: "0,30 17-18 * * *"
        timezone: Asia/Shanghai
        active: false
      - cron: "0 19 * * *"
        timezone: Asia/Shanghai
        active: false
    work_pool:
      name: windows-notify-pool
      work_queue_name: default
  - name: notify-升档市公司通报
