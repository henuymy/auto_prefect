[project]
name = "auto-notify"
version = "0.1.0"
description = "Prefect-based automated report notification workflow."
requires-python = ">=3.11"
dependencies = [
  "prefect==3.7.0",
  "requests>=2.31.0",
  "selenium>=4.0.0",
  "asyncpg>=0.29.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyMySQL>=1.1,<2.0",
  "alembic>=1.13,<2.0",
  "fastapi>=0.110.0,<0.116",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29.0,<1.0",
  "openpyxl>=3.1.0",
  "PyMuPDF>=1.24.0",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pip-tools>=7.4,<8.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=runtime/test-tmp"
markers = [
  "mysql_integration: requires an explicitly configured disposable MySQL test database",
]

[tool.ruff]
exclude = ["scripts"]

[tool.ruff.lint.per-file-ignores]
"flows/*.py" = ["E402"]
