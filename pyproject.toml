[project]
name = "auto-notify"
version = "0.1.0"
description = "Prefect-based automated report notification workflow."
requires-python = ">=3.11"
dependencies = [
  "prefect==3.7.0",
  "requests>=2.31.0",
  "selenium>=4.0.0",
  "asyncpg>=0.29.0",
  "SQLAlchemy>=2.0,<3.0",
  "PyMySQL>=1.1,<2.0",
  "alembic>=1.13,<2.0",
  "streamlit>=1.40.0",
  "nicegui>=2.0.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1.0",
  "pywin32>=306; platform_system == 'Windows'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
